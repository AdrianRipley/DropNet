# SPDX-License-Identifier: GPL-3.0-or-later
name: Android build and SQLite relay test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      # Official tag refs resolved and pinned on 2026-11-09.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install declared Android build components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36.1' 'build-tools;36.1.0' 'platform-tools'

      - name: Run JVM tests and build both debug APKs
        run: sh gradlew --no-daemon :core:test :app:assembleDebug :app:assembleDebugAndroidTest

      # The hosted runner is disposable. This is the action's documented KVM setup.
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native SQLite and codec relay test on API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 (peeled commit)
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p build/reports/relay
            bash --noprofile --norc -eo pipefail -c 'timeout 120 adb shell am instrument -w -r org.dropnet.demo.test/org.dropnet.demo.SelfTestInstrumentation | tee build/reports/relay/instrumentation.txt; tr -d "\r" < build/reports/relay/instrumentation.txt | grep -Fx "INSTRUMENTATION_RESULT: dropnet_status=passed"'

      - name: Upload APKs and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropnet-android-debug-and-tests
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/core/build/test-results/test/
            android/core/build/reports/tests/test/
            android/build/reports/relay/

# Emulator success validates native SQLite/codec behavior, not physical BLE,
# Android background reliability, radio range, power consumption or security.
