name: Python reference and reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: simulator
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Three-process UDP demonstration
        run: python scripts/run_local_demo.py --output scripts/local_outputs/ci
      - name: Reproduce all 2160 simulation runs
        run: python scripts/run_experiments.py --output scripts/outputs/ci
      - name: Independently validate results
        run: python scripts/validate_campaign.py scripts/outputs/ci
